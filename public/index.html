<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>DSpeak — Nexus Interface</title>
  <style>
    /* Mantenha seus estilos originais aqui... */
    .screen-stream-card { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
    .screen-stream-card video { width: 100%; height: 100%; }
    .live-badge { background: #ed4245; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- (Mantenha sua estrutura HTML de sidebar e botões igual) -->
  <div id="streams-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let localStream = null;
    let peerConnections = {}; // Armazena conexões P2P
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // Função de Transmissão (Screen Share)
    async function toggleScreenShare() {
      if (!localStream) {
        try {
          localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
          socket.emit('update-streaming-status', { channelId: connectedVoiceChannel, isStreaming: true });
          
          // Adiciona o vídeo na própria tela
          renderStream(username, localStream);

          // Avisa todos na sala que você começou a transmitir
          socket.emit('request-stream-connection', { targetChannel: connectedVoiceChannel });
        } catch (err) { console.error("Erro na transmissão:", err); }
      } else {
        stopScreenShare();
      }
    }

    // Ouvinte para quando alguém novo entra na sala, conectar a transmissão
    socket.on('request-stream-connection', (data) => {
        if(localStream) {
            createPeerConnection(data.senderSocketId, true);
        }
    });

    function createPeerConnection(targetSocketId, isInitiator) {
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetSocketId] = pc;

      // Adiciona o seu stream local para o peer
      if (localStream) {
        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      }

      pc.onicecandidate = e => { if (e.candidate) socket.emit('webrtc-candidate', { targetSocketId, candidate: e.candidate }); };
      pc.ontrack = e => { renderStream(targetSocketId, e.streams[0]); };

      if (isInitiator) {
        pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => socket.emit('webrtc-offer', { targetSocketId, offer: pc.localDescription }));
      }
      return pc;
    }

    function renderStream(userId, stream) {
      const container = document.getElementById('streams-container');
      let card = document.getElementById(`stream-${userId}`);
      if (!card) {
        card = document.createElement('div');
        card.id = `stream-${userId}`;
        card.className = 'screen-stream-card';
        card.innerHTML = `<video autoplay playsinline ${userId === username ? 'muted' : ''}></video>`;
        container.appendChild(card);
      }
      card.querySelector('video').srcObject = stream;
    }

    // Sinalização WebRTC (Repassar ofertas/respostas)
    socket.on('webrtc-offer', async (data) => {
        const pc = createPeerConnection(data.senderSocketId, false);
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        socket.emit('webrtc-answer', { targetSocketId: data.senderSocketId, answer: ans });
    });

    socket.on('webrtc-answer', async (d) => await peerConnections[d.senderSocketId].setRemoteDescription(new RTCSessionDescription(d.answer)));
    socket.on('webrtc-candidate', (d) => peerConnections[d.senderSocketId].addIceCandidate(new RTCIceCandidate(d.candidate)));

    function stopScreenShare() {
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      socket.emit('update-streaming-status', { channelId: connectedVoiceChannel, isStreaming: false });
      // Limpar peers...
    }
  </script>
</body>
</html>
