<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSpeak</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-servers: #202225;
            --bg-channels: #2f3136;
            --bg-chat: #36393f;
            --bg-panel: #292b2f;
            --text-normal: #dcddde;
            --text-muted: #8e9297;
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --danger: #ed4245;
            --success: #3ba55d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-chat);
            color: var(--text-normal);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Barra de Servidores */
        .servers-sidebar {
            width: 72px;
            background-color: var(--bg-servers);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--bg-channels);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .server-icon:hover, .server-icon.active {
            border-radius: 16px;
            background-color: var(--accent);
        }

        /* Barra de Canais */
        .channels-sidebar {
            width: 240px;
            background-color: var(--bg-channels);
            display: flex;
            flex-direction: column;
        }

        .server-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            font-weight: bold;
            border-bottom: 2px solid var(--bg-servers);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .channels-list {
            flex: 1;
            padding: 16px 8px;
            overflow-y: auto;
        }

        .channel-category {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .channel-item {
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
            transition: 0.2s;
        }

        .channel-item:hover, .channel-item.active {
            background-color: rgba(255,255,255,0.08);
            color: var(--text-normal);
        }

        /* Painel de Usuário na Barra de Canais */
        .user-panel {
            height: 52px;
            background-color: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 8px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .user-info {
            flex: 1;
            overflow: hidden;
        }

        .user-name {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-ping {
            font-size: 11px;
            color: var(--success);
        }

        /* Área Principal de Chat / Conteúdo */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-chat);
        }

        .chat-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-msg-item {
            display: flex;
            gap: 16px;
        }

        .chat-msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .chat-msg-body {
            flex: 1;
        }

        .chat-msg-header {
            display: flex;
            gap: 8px;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .chat-msg-author {
            font-weight: bold;
        }

        .chat-msg-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chat-msg-text {
            color: var(--text-normal);
            word-break: break-word;
        }

        .chat-input-container {
            padding: 0 16px 24px 16px;
        }

        .chat-input-wrapper {
            background-color: #40444b;
            border-radius: 8px;
            display: flex;
            padding: 10px 16px;
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-normal);
            outline: none;
            font-size: 15px;
        }

        /* Indicador AO VIVO */
        .live-badge {
            background-color: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Barra de Servidores (Sem o botão de adicionar) -->
    <div class="servers-sidebar">
        <div class="server-icon active" title="DSpeak Hub">DS</div>
    </div>

    <!-- Barra de Canais -->
    <div class="channels-sidebar">
        <div class="server-header">DSpeak Servidor</div>
        <div class="channels-list">
            <div class="channel-category">Canais de Texto</div>
            <div class="channel-item active" onclick="switchRoom('geral')"># geral</div>
            
            <div class="channel-category" style="margin-top: 16px;">Canais de Voz</div>
            <div class="channel-item" onclick="joinVoice('voz-1')">🔊 Sala de Voz 1</div>
        </div>

        <div class="user-panel">
            <div class="user-avatar" id="my-avatar">D</div>
            <div class="user-info">
                <div class="user-name" id="my-username">Daniel</div>
                <div class="user-ping" id="user-ping">Calculando ping...</div>
            </div>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="chat-header" id="current-room-title"># geral</div>
        
        <div class="chat-messages" id="chat-messages-list">
            <!-- As mensagens aparecem aqui -->
        </div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input type="text" class="chat-input" id="chat-input" placeholder="Conversar em #geral..." onkeypress="handleKeyPress(event)">
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let activeChannel = 'geral';
        let myUsername = 'Daniel';
        let localStream = null;

        // Entrar na sala inicial
        socket.emit('join-room', activeChannel);

        function switchRoom(room) {
            activeChannel = room;
            document.getElementById('current-room-title').innerText = `# ${room}`;
            document.getElementById('chat-messages-list').innerHTML = '';
            socket.emit('join-room', room);
        }

        async function joinVoice(channelId) {
            try {
                // Ativar microfone e áudio do usuário
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                socket.emit('join-voice-room', {
                    channelId: channelId,
                    username: myUsername,
                    gradient: 'linear-gradient(45deg, #5865f2, #3ba55d)'
                });
                alert('Conectado ao canal de voz com microfone ativo!');
            } catch (err) {
                console.error("Erro ao acessar o microfone:", err);
                alert("Permissão de microfone negada ou indisponível.");
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('chat-input');
                const message = input.value.trim();
                if (message) {
                    socket.emit('chat-message', {
                        room: activeChannel,
                        message: message,
                        user: myUsername,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    input.value = '';
                }
            }
        }

        // Receber mensagens
        socket.on('chat-message', (data) => {
            const list = document.getElementById('chat-messages-list');
            const div = document.createElement('div');
            div.className = 'chat-msg-item';
            div.innerHTML = `
                <div class="chat-msg-avatar">${data.user.charAt(0).toUpperCase()}</div>
                <div class="chat-msg-body">
                    <div class="chat-msg-header">
                        <span class="chat-msg-author">${data.user}</span>
                        <span class="chat-msg-time">${data.time || 'Agora'}</span>
                    </div>
                    <div class="chat-msg-text">${data.message}</div>
                </div>
            `;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        });

        // Atualização de usuários na voz (com suporte ao badge AO VIVO)
        socket.update-voice-users = socket.on('update-voice-users', (voiceUsers) => {
            // Atualizações de renderização dos participantes na sala de voz podem ser tratadas aqui
        });

        // Medidor de Ping Real com latência precisa
        setInterval(() => {
            const start = Date.now();
            socket.emit('ping-check', () => {
                const latency = Date.now() - start;
                document.getElementById('user-ping').innerText = `${latency} ms`;
            });
        }, 5000);
    </script>
</body>
</html>
