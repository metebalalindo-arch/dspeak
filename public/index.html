<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>DSpeak — Nexus Interface</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'gg sans', 'Helvetica Neue', Arial, sans-serif; background: #0c0d10; color: #cfd2d8; display: flex; height: 100vh; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #13151b; }
    ::-webkit-scrollbar-thumb { background: #ff5500; border-radius: 3px; box-shadow: 0 0 8px rgba(255, 85, 0, 0.4); }
    ::-webkit-scrollbar-thumb:hover { background: #ff7733; }

    /* Selo AO VIVO */
    .live-badge { background: #ff3333; color: #fff; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 0 8px rgba(255, 51, 51, 0.6); animation: pulse-live 1.5s infinite; }
    @keyframes pulse-live { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    #auth-overlay { position: fixed; inset: 0; background: rgba(12, 13, 16, 0.95); backdrop-filter: blur(12px); z-index: 5000; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: #13151b; width: 420px; padding: 32px; border-radius: 16px; border: 1px solid rgba(255, 85, 0, 0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(255, 85, 0, 0.2); display: flex; flex-direction: column; gap: 20px; }
    .auth-logo { font-size: 24px; font-weight: 800; color: #ff5500; text-align: center; text-shadow: 0 0 12px rgba(255,85,0,0.5); }
    #servers-sidebar { width: 78px; background: #0f1117; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 10px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid rgba(255, 85, 0, 0.12); }
    .server-icon { width: 48px; height: 48px; border-radius: 14px; background: #181b24; color: #cfd2d8; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); position: relative; user-select: none; flex-shrink: 0; border: 1px solid rgba(255, 255, 255, 0.04); }
    .server-icon:hover { border-radius: 16px; background: #ff5500; color: #fff; box-shadow: 0 0 16px rgba(255, 85, 0, 0.6); }
    .server-icon.active { border-radius: 16px; background: #ff5500; color: #fff; box-shadow: 0 0 20px rgba(255, 85, 0, 0.8); }
    .server-divider { width: 32px; height: 2px; background: rgba(255, 85, 0, 0.2); border-radius: 1px; margin: 4px 0; flex-shrink: 0; }
    .action-icon { background: #181b24; color: #00ffcc; border: 1px solid rgba(0, 255, 204, 0.2); }
    #sidebar { width: 280px; background: #13151b; display: flex; flex-direction: column; position: relative; overflow: hidden; height: 100vh; flex-shrink: 0; border-right: 1px solid rgba(255, 85, 0, 0.08); }
    .server-header { height: 52px; padding: 0 18px; font-weight: bold; color: #f2f3f5; border-bottom: 1px solid rgba(255, 85, 0, 0.1); font-size: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.15s; background: rgba(255, 85, 0, 0.03); }
    .server-menu { display: none; position: absolute; top: 56px; left: 10px; right: 10px; background: #181b24; border-radius: 8px; padding: 6px; box-shadow: 0 12px 30px rgba(0,0,0,0.8); z-index: 100; border: 1px solid rgba(255, 85, 0, 0.2); }
    .menu-item { padding: 9px 12px; color: #b5bac1; font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .server-channels-scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
    .section-header { padding: 14px 14px 4px 14px; font-size: 11px; font-weight: 700; color: #ff5500; text-transform: uppercase; letter-spacing: 0.8px; display: flex; justify-content: space-between; align-items: center; }
    .add-channel-btn { cursor: pointer; font-size: 18px; color: #8a8f9d; }
    .channel-list { display: flex; flex-direction: column; gap: 3px; padding: 0 6px; }
    .channel { padding: 8px 10px; border-radius: 8px; color: #8a8f9d; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin: 0 4px; }
    .channel.active { background: rgba(255, 85, 0, 0.15); color: #fff; }
    .channel-info { display: flex; align-items: center; gap: 8px; }
    .voice-user-sublist { display: flex; flex-direction: column; gap: 2px; padding-left: 22px; margin-top: 2px; }
    .voice-user-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 13px; color: #dbdee1; cursor: pointer; }
    .voice-user-avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; flex-shrink: 0; background-size: cover; background-position: center; border: 1px solid rgba(255,255,255,0.1); }
    .voice-user-name { font-size: 13px; color: #b5bac1; }
    .discord-deck { margin: 10px; flex-shrink: 0; background: #181b24; border-radius: 14px; display: flex; flex-direction: column; border: 1px solid rgba(255, 85, 0, 0.2); }
    .voice-connection-panel { display: none; background: #13151b; padding: 12px 14px; border-bottom: 1px solid rgba(255, 85, 0, 0.15); align-items: center; justify-content: space-between; }
    .btn-disconnect-voice { background: transparent; border: none; cursor: pointer; }
    .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 10px; }
    .grid-btn { background: #1c202d; border: 1px solid rgba(255,255,255,0.04); height: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .user-profile-bar { padding: 10px 12px; display: flex; align-items: center; gap: 10px; background: #181b24; cursor: pointer; }
    .user-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; background-size: cover; border: 1px solid #ff5500; }
    .status-dot { width: 12px; height: 12px; background: #00ffcc; border-radius: 50%; position: absolute; bottom: -1px; right: -1px; border: 2px solid #181b24; }
    .user-name { font-size: 14px; font-weight: bold; color: #f2f3f5; }
    .user-handle { font-size: 11px; color: #8a8f9d; }
    .status-selector-popover { display: none; position: absolute; bottom: 65px; left: 12px; background: #13151b; border: 1px solid #ff5500; border-radius: 8px; padding: 6px; z-index: 1000; width: 180px; }
    .status-opt-item { padding: 8px 10px; cursor: pointer; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(6, 7, 10, 0.88); z-index: 1500; justify-content: center; align-items: center; }
    .modal { background: #13151b; width: 440px; border-radius: 16px; padding: 24px; border: 1px solid rgba(255, 85, 0, 0.3); }
    .settings-modal { width: 780px; height: auto; max-height: 85vh; padding: 0; display: flex; }
    .settings-sidebar-nav { width: 220px; background: #0f1117; padding: 20px; }
    .settings-main-wrapper { flex: 1; padding: 20px; overflow-y: auto; }
    .modal-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .modal-field input { background: #0c0d10; border: 1px solid rgba(255, 85, 0, 0.2); padding: 8px; border-radius: 8px; color: #fff; }
    .btn-create { background: #ff5500; border: none; color: #fff; padding: 8px 20px; border-radius: 8px; cursor: pointer; }
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0c0d10; }
    #chat-header { height: 52px; background: #13151b; border-bottom: 1px solid rgba(255, 85, 0, 0.12); display: flex; align-items: center; padding: 0 18px; }
    .content-workspace { flex: 1; display: flex; flex-direction: row; overflow: hidden; }
    #voice-room-view { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; }
    .stage-layout { flex: 1; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: center; }
    #streams-container { display: none; gap: 12px; }
    .screen-stream-card { width: 400px; aspect-ratio: 16/9; background: #000; border-radius: 12px; border: 2px solid #ff5500; overflow: hidden; }
    .screen-stream-card video { width: 100%; height: 100%; object-fit: contain; }
    .connected-users-stage { display: grid; grid-template-columns: repeat(auto-fill, 110px); gap: 12px; }
    .user-card { width: 110px; height: 110px; border-radius: 14px; background: #181b24; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255, 85, 0, 0.3); }
    .card-avatar { width: 50px; height: 50px; border-radius: 50%; background-size: cover; border: 2px solid #ff5500; display: flex; align-items: center; justify-content: center; }
    .card-name-pill { font-size: 12px; font-weight: bold; margin-top: 8px; color: #fff; }
    .stage-controls-dock { background: #13151b; padding: 12px; border-radius: 16px; border: 1px solid #ff5500; display: flex; gap: 10px; justify-content: center; }
    .stage-btn { width: 45px; height: 45px; border-radius: 10px; background: #1c202d; color: #fff; border: none; cursor: pointer; }
    .active-share { background: #ff3333 !important; }
    #right-chat-sidebar { width: 340px; background: #13151b; border-left: 1px solid rgba(255, 85, 0, 0.12); display: flex; flex-direction: column; }
    #chat-messages-list { flex: 1; padding: 16px; overflow-y: auto; }
    .chat-message-item { display: flex; gap: 10px; margin-bottom: 10px; }
    .form-container { padding: 10px; }
    .input-wrapper { display: flex; background: #0c0d10; padding: 8px; border-radius: 8px; }
    .input-wrapper input { flex: 1; background: none; border: none; color: #fff; }
  </style>
</head>
<body>

  <!-- Overlay Conectar -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div class="auth-logo">DSPEAK CLIENT</div>
      <input type="text" id="nickname-input" placeholder="Seu apelido..." style="padding: 10px; border-radius: 8px; border: 1px solid #ff5500; background: #0c0d10; color: #fff;">
      <button class="btn-create" onclick="connectToServer()">Entrar</button>
    </div>
  </div>

  <!-- Sidebar Servidores -->
  <div id="servers-sidebar">
    <div id="servers-list-container"></div>
    <div class="server-icon action-icon" onclick="openCreateServerModal()">+</div>
  </div>

  <!-- Sidebar Canais -->
  <div id="sidebar">
    <div class="server-header" onclick="toggleServerMenu(event)">DSPEAK ▼</div>
    <div class="server-channels-scroll-area">
      <div class="section-header">Canais de Texto <span class="add-channel-btn" onclick="openCreateChannel('text')">+</span></div>
      <div class="channel-list" id="text-channels"></div>
      <div class="section-header" style="margin-top: 10px;">Canais de Voz <span class="add-channel-btn" onclick="openCreateChannel('voice')">+</span></div>
      <div class="channel-list" id="voice-channels"></div>
    </div>
    <div class="discord-deck">
      <div class="voice-connection-panel" id="voice-connection-panel">
        <div class="voice-status-info"><span id="voice-status-channel-name">Lobby</span></div>
        <button class="btn-disconnect-voice" onclick="disconnectVoice()">❌</button>
      </div>
      <div class="action-grid">
        <button class="grid-btn" id="mic-btn" onclick="toggleMute()" disabled>🎤</button>
        <button class="grid-btn" id="deafen-btn" onclick="toggleDeafen()" disabled>🎧</button>
        <button class="grid-btn" id="share-btn" onclick="toggleScreenShare()" disabled>🖥️</button>
      </div>
      <div class="user-profile-bar" id="user-profile-bar">
        <div class="user-avatar" id="footer-user-avatar"></div>
        <div class="user-details"><span class="user-name" id="user-display-name">User</span></div>
      </div>
    </div>
  </div>

  <!-- Área Principal -->
  <div id="main">
    <div id="chat-header"><span id="chat-header-title"># geral</span></div>
    <div class="content-workspace">
      <div id="voice-room-view">
        <div class="stage-layout">
          <div id="streams-container"></div>
          <div class="connected-users-stage" id="connected-users-stage"></div>
        </div>
        <div class="stage-controls-dock">
          <button class="stage-btn" id="stage-share-btn" onclick="toggleScreenShare()">📺</button>
        </div>
      </div>
      <div id="right-chat-sidebar">
        <div id="chat-messages-list"></div>
        <form class="form-container" onsubmit="sendTextMessage(event)">
          <div class="input-wrapper"><input id="input" placeholder="Mensagem..."></div>
        </form>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let username = "", activeStreams = {}, peerConnections = {};
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let localStream = null, connectedVoiceChannel = null, voiceChannelUsers = {};

    function connectToServer() {
      username = document.getElementById('nickname-input').value;
      if (!username) return;
      document.getElementById('auth-overlay').style.display = 'none';
      socket.emit('register-user', { username });
      switchServer('dspeak');
    }

    function switchServer(id) {
      renderChannels();
    }

    function renderChannels() {
      const voiceContainer = document.getElementById('voice-channels');
      voiceContainer.innerHTML = '';
      const usersInChannel = voiceChannelUsers[connectedVoiceChannel] || [];
      
      const div = document.createElement('div');
      div.className = 'channel';
      div.innerHTML = `<div class="channel-info"><span>🔊 Lobby</span></div>`;
      div.onclick = () => connectVoice('lobby', 'Lobby');
      voiceContainer.appendChild(div);

      const sublist = document.createElement('div');
      sublist.className = 'voice-user-sublist';
      usersInChannel.forEach(u => {
        const isLive = activeStreams.hasOwnProperty(u.name);
        const liveBadge = isLive ? '<span class="live-badge" style="margin-left: 6px;">AO VIVO</span>' : '';
        const sub = document.createElement('div');
        sub.innerHTML = `<span class="voice-user-name">${u.name} ${liveBadge}</span>`;
        sublist.appendChild(sub);
      });
      voiceContainer.appendChild(sublist);
    }

    function connectVoice(id, name) {
      connectedVoiceChannel = id;
      socket.emit('join-voice-room', { channelId: id, username });
      document.getElementById('voice-connection-panel').style.display = 'flex';
      document.getElementById('mic-btn').disabled = false;
      document.getElementById('share-btn').disabled = false;
    }

    function renderStageUsers() {
      const stage = document.getElementById('connected-users-stage');
      stage.innerHTML = '';
      const users = voiceChannelUsers[connectedVoiceChannel] || [];
      users.forEach(u => {
        const isLive = activeStreams.hasOwnProperty(u.name);
        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = `<div class="card-name-pill">${u.name}</div>${isLive ? '<span class="live-badge">AO VIVO</span>' : ''}`;
        stage.appendChild(card);
      });
    }

    async function toggleScreenShare() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        addScreenStream(username, localStream);
        document.getElementById('share-btn').classList.add('active-share');
        
        const usersInChannel = voiceChannelUsers[connectedVoiceChannel] || [];
        usersInChannel.forEach(u => {
          if (u.socketId !== socket.id) createPeerConnection(u.socketId, true);
        });
      } else {
        stopScreenShare();
      }
    }

    function stopScreenShare() {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
      removeScreenStream(username);
      document.getElementById('share-btn').classList.remove('active-share');
    }

    function createPeerConnection(targetSocketId, isInitiator) {
      if (peerConnections[targetSocketId]) return peerConnections[targetSocketId];
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetSocketId] = pc;
      if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      pc.ontrack = (e) => {
        const u = (voiceChannelUsers[connectedVoiceChannel] || []).find(user => user.socketId === targetSocketId);
        addScreenStream(u ? u.name : "Amigo", e.streams[0]);
      };
      pc.onicecandidate = (e) => { if (e.candidate) socket.emit('webrtc-candidate', { targetSocketId, candidate: e.candidate }); };
      if (isInitiator) pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => socket.emit('webrtc-offer', { targetSocketId, offer: pc.localDescription }));
      return pc;
    }

    socket.on('webrtc-offer', async (data) => {
      const pc = createPeerConnection(data.senderSocketId, false);
      await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      socket.emit('webrtc-answer', { targetSocketId: data.senderSocketId, answer });
    });

    socket.on('webrtc-answer', async (data) => { await peerConnections[data.senderSocketId].setRemoteDescription(new RTCSessionDescription(data.answer)); });
    socket.on('webrtc-candidate', async (data) => { await peerConnections[data.senderSocketId].addIceCandidate(new RTCIceCandidate(data.candidate)); });

    function addScreenStream(user, stream) {
      activeStreams[user] = stream;
      renderStreamsContainer();
      renderChannels();
      renderStageUsers();
    }

    function removeScreenStream(user) {
      delete activeStreams[user];
      renderStreamsContainer();
      renderChannels();
      renderStageUsers();
    }

    function renderStreamsContainer() {
      const container = document.getElementById('streams-container');
      container.style.display = Object.keys(activeStreams).length > 0 ? 'flex' : 'none';
      container.innerHTML = '';
      Object.keys(activeStreams).forEach(key => {
        const card = document.createElement('div');
        card.className = 'screen-stream-card';
        const vid = document.createElement('video');
        vid.autoplay = true; vid.srcObject = activeStreams[key];
        card.appendChild(vid);
        container.appendChild(card);
      });
    }

    function sendTextMessage(e) { e.preventDefault(); socket.emit('chat-message', { room: activeChannel, message: document.getElementById('input').value, user: username }); document.getElementById('input').value = ''; }
    socket.on('update-voice-users', (data) => { voiceChannelUsers = data; renderChannels(); renderStageUsers(); });
    socket.on('chat-message', (data) => { const list = document.getElementById('chat-messages-list'); list.innerHTML += `<div><b>${data.user}:</b> ${data.message}</div>`; list.scrollTop = list.scrollHeight; });
  </script>
</body>
</html>
