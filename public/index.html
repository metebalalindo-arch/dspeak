<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>DSpeak — Nexus Interface</title>
  <style>
    /* Estilos preservados (Ocultos para brevidade, mantenha o seu CSS atual aqui) */
    body { background: #0c0d10; color: #cfd2d8; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
    #auth-overlay { position: fixed; inset: 0; background: #0c0d10; z-index: 5000; display: flex; align-items: center; justify-content: center; }
    .auth-card { background: #13151b; width: 400px; padding: 30px; border-radius: 15px; border: 1px solid #ff5500; }
    /* ... mantenha todo o seu CSS original aqui ... */
    .live-badge { background: #ed4245; color: white; font-size: 9px; padding: 2px 5px; border-radius: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="auth-overlay">
    <div class="auth-card">
      <input type="text" id="nickname-input" placeholder="Seu apelido" />
      <button onclick="connectToServer()">Entrar</button>
    </div>
  </div>

  <div id="main">
    <div id="voice-room-view">
        <div id="streams-container" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
        <div class="stage-controls-dock">
            <button onclick="toggleScreenShare()">📡 Transmitir Tela</button>
        </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let localStream = null;
    let peerConnections = {};
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function startScreenShare() {
      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        socket.emit('update-streaming-status', { channelId: connectedVoiceChannel, isStreaming: true });
        
        // Avisar outros na sala (logica simplificada para criar conexões)
        const usersInChannel = voiceChannelUsers[connectedVoiceChannel] || [];
        usersInChannel.forEach(u => {
            if (u.socketId !== socket.id) createPeerConnection(u.socketId, true);
        });
      } catch (err) { console.error(err); }
    }

    function createPeerConnection(targetSocketId, isInitiator) {
      const pc = new RTCPeerConnection(rtcConfig);
      peerConnections[targetSocketId] = pc;

      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.onicecandidate = e => { if (e.candidate) socket.emit('webrtc-candidate', { targetSocketId, candidate: e.candidate }); };
      pc.ontrack = e => { 
          const video = document.createElement('video');
          video.srcObject = e.streams[0];
          video.autoplay = true;
          document.getElementById('streams-container').appendChild(video);
      };

      if (isInitiator) {
        pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => socket.emit('webrtc-offer', { targetSocketId, offer: pc.localDescription }));
      }
      return pc;
    }

    socket.on('webrtc-offer', async (data) => {
        const pc = createPeerConnection(data.senderSocketId, false);
        await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        socket.emit('webrtc-answer', { targetSocketId: data.senderSocketId, answer: ans });
    });

    socket.on('webrtc-answer', async (d) => await peerConnections[d.senderSocketId].setRemoteDescription(new RTCSessionDescription(d.answer)));
    socket.on('webrtc-candidate', (d) => peerConnections[d.senderSocketId].addIceCandidate(new RTCIceCandidate(d.candidate)));
  </script>
</body>
</html>
